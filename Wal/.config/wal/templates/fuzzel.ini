[main]
font=Hurmit Nerd Font:size=14:weight=regular
icon-theme=Papirus-Dark
icons-enabled=no
terminal=kitty
prompt="  "
placeholder="Search..."
lines=8
width=40
horizontal-pad=20
vertical-pad=16
inner-pad=12
image-size-ratio=0.55
line-height=32
letter-spacing=0
use-bold=yes
match-mode=fzf
sort-result=yes

[colors]
background={background.strip}ee
text={foreground.strip}ff
match={color4.strip}ff
selection={color1.strip}ff
selection-text={foreground.strip}ff
selection-match={color4.strip}ff
border={color4.strip}ff
placeholder={color8.strip}ff
counter={color8.strip}ff

[border]
width=2
radius=16

[dmenu]
exit-immediately-if-empty=yes
