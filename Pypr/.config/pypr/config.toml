[pyprland]
plugins = ["scratchpads"]

[scratchpads.telegram]
animation = "fromRight"
command = "flatpak run org.telegram.desktop"
class = "org.telegram.desktop"
process_tracking = false
size = "25% 71%"
position = "74% 44px"
unfocus = "hide"
lazy = true

[scratchpads.session]
animation = "fromRight"
command = "/opt/Session/session-desktop"
class = "Session"
process_tracking = false
size = "45% 94%"
position = "54% 55px"
unfocus = "hide"
lazy = true

